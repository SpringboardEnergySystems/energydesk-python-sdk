[metadata]
name = energydesk-python-sdk
version = 1.2.0
description = SDK with examples on how to access the EnergyDesk REST API
long_description = file: README.rst
url = https://springboard.energy/
author = Steinar Rune Eriksen
author_email = steinar@springboard.energy


[options]
include_package_data = true
packages = find:
install_requires =
    python-dotenv>=0.19.0
    django-environ>=0.11.0
    requests>=2.31.0
    pandas
    pytz
    python-dateutil
    pendulum>=2.1.2
    pydantic>=2.6
    pydantic-settings>=2.2
    networkx>=2.6.3
    croniter>=2.0
    babel
    py-moneyed
    # OIDC / FastAPI auth support
    fastapi>=0.104.0
    authlib>=1.2.1
    itsdangerous>=2.1.0
    starlette
